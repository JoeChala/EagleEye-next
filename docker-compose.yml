services:

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile

    container_name: eagleeye-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    depends_on:
      - postgres
      - qdrant

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: eagleeye-postgres

    environment:
      POSTGRES_USER: eagleeye
      POSTGRES_PASSWORD: eagleeye
      POSTGRES_DB: eagleeye

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant

    container_name: eagleeye-qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data: