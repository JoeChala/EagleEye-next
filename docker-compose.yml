services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: eagleeye-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: eagleeye-postgres
    environment:
      POSTGRES_DB: eagleeye
      POSTGRES_USER: eagleeye
      POSTGRES_PASSWORD: eagleeye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eagleeye-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

