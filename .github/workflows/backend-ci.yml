name: Backend CI

"on":
  push:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eagleeye_test
          POSTGRES_USER: eagleeye
          POSTGRES_PASSWORD: eagleeye
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eagleeye -d eagleeye_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://eagleeye:eagleeye@localhost:5432/eagleeye_test

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .
      
      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest